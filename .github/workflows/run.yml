name: Docker Run

on:
  schedule:
    # Daily at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: Container command to run
        type: choice
        default: all
        options:
          - all
          - scraper:scrape
          - claimer:claim
      vnc:
        description: Expose noVNC through a Cloudflare tunnel
        type: boolean
        default: false

# packages: read is required to pull the private image from GHCR
permissions:
  contents: read
  packages: read

concurrency:
  group: docker-run
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: latest
  # Mirrors docker-compose.yaml: host networking, big /dev/shm, 4G cap
  DOCKER_ARGS: >-
    --rm
    --network host
    --shm-size=2g
    --memory=4g
    -e DISPLAY=:99
    -e SCREEN_WIDTH=1366
    -e SCREEN_HEIGHT=768
    -e SCREEN_DEPTH=24
    -e VNC_PORT=5900
    -e NOVNC_PORT=6080
  NOVNC_PORT: 6080

jobs:
  # Scraper and claimer are separate jobs on purpose: every job gets its own
  # runner VM, so each job egresses from a different IP. Steps inside one job
  # always share the same IP, so splitting them into steps would not help.
  # All shared setup lives in .github/actions/run-container, so both jobs run
  # the same code on different machines. Check the "Report egress IP" step in
  # each job to confirm the addresses actually differ.
  scraper:
    name: Scrape
    if: github.event.inputs.command == '' || github.event.inputs.command == 'all' || github.event.inputs.command == 'scraper:scrape'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAIL_AUTH_USER: ${{ secrets.MAIL_AUTH_USER }}
      MAIL_AUTH_PASS: ${{ secrets.MAIL_AUTH_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run scraper
        uses: ./.github/actions/run-container
        with:
          command: scraper:scrape
          image: ${{ env.IMAGE }}
          tag: ${{ env.TAG }}
          docker-args: ${{ env.DOCKER_ARGS }}
          # Off for scheduled runs: the tunnel costs ~60s and nobody watches
          # noVNC on a cron run. Only workflow_dispatch can enable it.
          vnc: ${{ github.event.inputs.vnc == 'true' }}
          tunnel-token: ${{ secrets.CF_TUNNEL_TOKEN }}
          auth-user: ${{ secrets.VNC_AUTH_USER }}
          auth-pass: ${{ secrets.VNC_AUTH_PASS }}
          public-url: ${{ vars.CF_PUBLIC_URL }}
          novnc-port: ${{ env.NOVNC_PORT }}

  claimer:
    name: Claim
    # Independent of the scraper job on purpose: a `needs` edge would skip this
    # job whenever the scraper job is skipped (e.g. command = claimer:claim),
    # and the claimer only claims rows the previous run already scraped. Running
    # in parallel also guarantees two distinct runner VMs.
    if: github.event.inputs.command == '' || github.event.inputs.command == 'all' || github.event.inputs.command == 'claimer:claim'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAIL_AUTH_USER: ${{ secrets.MAIL_AUTH_USER }}
      MAIL_AUTH_PASS: ${{ secrets.MAIL_AUTH_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run claimer
        uses: ./.github/actions/run-container
        with:
          command: claimer:claim
          image: ${{ env.IMAGE }}
          tag: ${{ env.TAG }}
          docker-args: ${{ env.DOCKER_ARGS }}
          vnc: ${{ github.event.inputs.vnc == 'true' }}
          tunnel-token: ${{ secrets.CF_TUNNEL_TOKEN }}
          auth-user: ${{ secrets.VNC_AUTH_USER }}
          auth-pass: ${{ secrets.VNC_AUTH_PASS }}
          public-url: ${{ vars.CF_PUBLIC_URL }}
          novnc-port: ${{ env.NOVNC_PORT }}

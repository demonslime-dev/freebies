name: Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *"

env:
  DATABASE_URL: ${{secrets.DATABASE_URL}}
  MAIL_AUTH_USER: ${{secrets.MAIL_AUTH_USER}}
  MAIL_AUTH_PASS: ${{secrets.MAIL_AUTH_PASS}}

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Patchright Browser
        id: cache-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # Only run the full install if the cache missed
      - name: Install Patchright Browser (Cache Miss)
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: pnpm exec patchright install chrome --with-deps

      # If cache hit, we still need the OS-level system dependencies (libgbm, libnss3, etc.)
      # These are small/fast to install and aren't part of the home directory cache.
      - name: Install System Dependencies (Cache Hit)
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: pnpm exec patchright install-deps chrome

      - name: Start scraper
        run: pnpm run scraper:scrape

  claim:
    name: Claim
    runs-on: ubuntu-22.04
    needs: scrape
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Install patchright browser with dependencies
        run: pnpm exec patchright install chrome --with-deps

      - name: Start claimer
        run: pnpm run claimer:claim
